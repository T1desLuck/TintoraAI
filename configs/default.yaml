                    # Базовая конфигурация TintoraAI (стартовый скелет)
project_name: TintoraAI                      # Имя проекта (строка). Используется в логах/экспериментах.
seed: 42                                     # Глобальное зерно случайности (int) для воспроизводимости.

paths:                                       # Пути к данным, логам и экспериментам (можно задать абсолютные)
  data_root: data                            # Корневой каталог данных; по умолчанию 'data'.
  train_dir: data/train                      # Каталог обучающих изображений (jpg/png) без подпапок.
  val_dir: data/val                          # Каталог валидационных изображений.
  test_dir: data/test                        # Каталог тестовых изображений (опционально).
  checkpoints: checkpoints                   # Папка для чекпоинтов моделей.
  logs: logs                                 # Папка для логов (TensorBoard, текстовые логи).
  experiments: experiments/exp_default       # Папка конкретного эксперимента (визуализации и др.).

runtime:                                     # Настройки выполнения
  device: auto                               # Выбор устройства: auto|cuda|cpu. 'auto' выберет CUDA при наличии.
  amp: true                                  # Смешанная точность (AMP) для ускорения и экономии памяти.
  num_workers: 4                             # Кол-во воркеров DataLoader на процесс (подбирайте под систему).
  pin_memory: true                           # Фиксация памяти хост-страницы для ускорения передачи на GPU.
  cudnn_benchmark: true                      # Оптимизация бэкенда cuDNN для фиксированных размеров батча.
  ddp:                                       # Параметры распределённого обучения (Distributed Data Parallel)
    enabled: false                           # Включить/выключить DDP (несколько GPU/процессов).
    backend: auto                            # Бэкенд: nccl|gloo|mpi|auto. На CUDA обычно 'nccl'.
checkpointing:                               # Политика сохранения моделей
  save_best: true                            # Сохранять лучший чекпоинт по метрике 'best_metric'.
  best_metric: ssim                          # Целевая метрика для 'best': ssim|lpips (см. validation.*).
  save_latest: true                          # Сохранять последний чекпоинт после каждой/неск. эпох.
  latest_names:                              # Имена последних чекпоинтов
    model: latest.pth                        # Имя файла последней обычной модели.
    ema: latest_ema.pth                      # Имя файла последней EMA-модели (если EMA включен).
  best_names:                                # Имена лучших чекпоинтов
    model: best_ssim.pth                     # Лучший по 'best_metric' (модель).
    ema: best_ssim_ema.pth                   # Лучший по 'best_metric' (EMA-модель).

optimizer:                                   # Оптимизатор и базовые скорости обучения
  type: adamw                                # Тип оптимизатора: adamw (рекомендуется). Альтернативы требуют доработки кода.
  lr_backbone: 8.0e-5                        # Начальный LR для бэкбона (ConvNeXt/CoAtNet/Transformer).
  lr_decoder_heads: 2.0e-4                   # Начальный LR для декодера и голов (обычно выше, чем у бэкбона).
  weight_decay_backbone: 1.0e-2              # Weight decay для бэкбона (регуляризация).
  weight_decay_other: 1.0e-3                 # Weight decay для прочих модулей (декодер/головы и т.п.).

scheduler:                                   # Планировщик скорости обучения
  type: cosine                               # Тип планировщика LR: cosine. Другие варианты потребуют поддержки в коде.
  warmup_steps: 1000                         # Количество шагов линейного разогрева LR в начале обучения.

training:                                    # Глобальные параметры обучения
  epochs: 40                                 # Общее число эпох. Фазовый план ниже распределяет потери по эпохам.
  batch_size: 4                              # Размер батча на процесс (увеличивайте при наличии памяти).
  image_size: 256                            # Квадратный размер кроя (H=W). Должен быть кратен 8.
  curriculum_phase: -1                       # Начальная фаза (-1,0,1,2,3,4) — используется при ручном управлении.
  save_every_epochs: 1                       # Частота сохранения latest-чекпоинтов (в эпохах).
  validate_every_epochs: 1                   # Частота валидации (в эпохах).
  dataset: advanced                          # Выбор датасета: advanced|simple (см. реализацию датасетов).
  aug:                                       # Базовые аугментации
    flip_p: 0.5                              # Вероятность горизонтального/вертикального флипа (0..1). Реализация может отличаться.
    crop_scale: [0.8, 1.0]                   # Диапазон масштаба случайного кропа относительно исходника.
    ab_jitter: 0.05                          # Случайный джиттер в a/b-каналах (Lab) для повышения разнообразия.
  ema:                                       # Экспоненциальное сглаживание весов модели (EMA)
    enabled: true                            # Включить EMA-модель для более стабильной валидации/инференса.
    decay: 0.999                             # Коэффициент EMA (0.99..0.9999). Выше — сильнее сглаживание.
    start_epoch: 1                           # Эпоха, с которой начинать обновлять EMA.
  dlb:                                       # Динамическая балансировка потерь (если поддерживается)
    enabled: true                            # Включение/выключение DLB.
    decay: 0.9                               # Параметр сглаживания для DLB (при наличии реализации).
  curriculum:                                # Пошаговое включение компонентов обучения по фазам
    enabled: true                            # Включить расписание фаз (см. список ниже).
    phases:                                  # Список фаз с их эпохами и весами потерь
                                             # Эпохи указываются включительно. Пример — адаптируйте под свою задачу/ресурсы.
      - from: 1                              # Начальная эпоха фазы.
        to: 3                                # Конечная эпоха фазы.
        phase: -1                            # Фаза SSL(-1): предварительное самосупервизируемое обучение бэкбона.
        omm_read_only: true                  # Запрет чтения из OMM (только запись/инициализация стейта).
        loss:                                # Веса потерь, переопределяющие секцию 'loss' на период фазы
          lambda_l1: 0.0                     # Пиксельная L1 по a/b выключена на SSL.
          lambda_perc: 0.0                   # Перцептуал (VGG) выключен на SSL.
          lambda_cc: 0.0                     # Color Consistency выключен на SSL.
          lambda_photo: 0.0                  # Фотометрия глубины выключена на SSL.
          lambda_entropy: 0.0                # Регулятор энтропии прототипов выключен.
          lambda_ds: 0.0                     # Сглаживание глубины выключено.
          lambda_cluster: 0.0                # Кластерная регуляция прототипов выключена.
          lambda_adv: 0.0                    # GAN-потеря выключена.
      - from: 4                              # Начальная эпоха фазы (включительно).
        to: 10                               # Конечная эпоха фазы (включительно).
        phase: 0                             # Прогрев: базовый L1, без чтения из памяти.
        omm_read_only: true                  # Чтение из OMM отключено; только запись/сбор статистик.
        loss:
          lambda_l1: 1.0                     # Базовый L1 включён на прогреве.
          lambda_perc: 0.0                   # Перцептуал пока выключен.
          lambda_cc: 0.0                     # Согласованность цвета пока выключена.
          lambda_photo: 0.0                  # Фотометрия глубины пока выключена.
          lambda_entropy: 0.0                # Регулятор энтропии прототипов выключен.
          lambda_ds: 0.0                     # Сглаживание глубины пока выключено.
          lambda_cluster: 0.0                # Кластерная регуляция прототипов выключена.
          lambda_adv: 0.0                    # GAN выключен на этой фазе.
      - from: 11                             # Начальная эпоха фазы (включительно).
        to: 20                               # Конечная эпоха фазы (включительно).
        phase: 1                             # Подключение карт глубины/освещения и фотометрических потерь.
        omm_read_only: true                  # Разрешено чтение из OMM во время forward.
        loss:
          lambda_l1: 1.0                     # L1 остаётся базовым сигналом.
          lambda_photo: 0.2                  # Включаем фотометрическую консистентность.
          lambda_ds: 0.02                    # И добавляем сглаживание глубины.
      - from: 21                             # Начальная эпоха фазы (включительно).
        to: 28                               # Конечная эпоха фазы (включительно).
        phase: 2                             # Включение перцептуальной потери (VGG).
        omm_read_only: true                  # Разрешено чтение из OMM во время forward.
        loss:
          lambda_perc: 0.1                   # Подключаем Perceptual (VGG) для деталей.
          lambda_entropy: 0.01               # Лёгкий регулятор энтропии прототипов (опционально).
      - from: 29                             # Начальная эпоха фазы (включительно).
        to: 36                               # Конечная эпоха фазы (включительно).
        phase: 3                             # Чтение из OMM и Color Consistency.
        omm_read_only: false                 # Разрешено чтение из OMM во время forward.
        loss:
          lambda_cc: 0.2                     # Согласованность цвета с подсказками OMM.
          lambda_cluster: 0.05               # Регуляризуем распределение прототипов.
      - from: 37                             # Начальная эпоха фазы (включительно).
        to: 40                               # Конечная эпоха фазы (включительно).
        phase: 4                             # Финальная GAN-донастройка (PatchGAN).
        omm_read_only: false                 # Разрешено чтение из OMM во время forward.
        loss:
          lambda_adv: 0.02                   # Подключаем адверсариальную потерю (PatchGAN).

loss:                                        # Базовые веса потерь (могут переопределяться в curriculum.phases[*].loss)
  lambda_l1: 1.0                             # Пиксельная L1-потеря в Lab (a/b).
  lambda_perc: 0.1                           # Перцептуальная потеря (VGG). Включается на фазах ≥2.
  lambda_adv: 0.0                            # Адверсариальная потеря (PatchGAN). Включается на фазе 4.
  lambda_photo: 0.2                          # Фотометрическая консистентность для глубины (фаза ≥1).
  lambda_ds: 0.2                             # Сглаживание глубины (edge-aware) (фаза ≥1).
  lambda_cc: 0.2                             # Color Consistency между регионами (фаза 3).
  lambda_cluster: 0.5                        # Регуляризация кластеров/прототипов.
  lambda_entropy: 0.1                        # Регуляризатор энтропии распределений по прототипам (опционально).

ssl:                                         # Самосупервизия (SSL) для фазы -1 (например, PatchNCE или аналог)
  enabled: true                              # Включить SSL-предобучение бэкбона на фазе -1.
  patchnce:                                  # Настройки PatchNCE (если используется соответствующая реализация)
    temperature: 0.07                        # Температура для контрастивного распределения (меньше — более остро).
    normalize: true                          # L2-нормализация признаков перед сравнением.

omm:                                         # Object Memory Module — банк прототипов цвета/семантики
  enabled: true                              # Включение/выключение OMM.
  N: 2048                                    # Размер банка прототипов (кол-во прототипов).
  D: 256                                     # Размерность пространства признаков прототипов.
  top_k: 64                                  # Кол-во ближайших прототипов, участвующих в softmax-взвешивании.
  tau: 0.07                                  # Температура softmax (ниже — распределение острее).
  alpha: 0.995                               # EMA-коэффициент обновления прототипов/статистик (0.99..0.999).
  min_support: 15                            # Порог «поддержки» прототипа для обслуживания/реинициализации (не маска чтения).
  sync:                                      # Синхронизация OMM в распределённом режиме
    enabled: true                            # Включить синхронизацию состояния OMM между процессами.
    update_interval: 1                       # Зарезервировано: интервал обновлений; текущая реализация синхронизирует на каждом шаге.
    master_rank: 0                           # Ранг-процесс, ответственный за сведение состояния (обычно 0).

logging:                                     # Логирование и визуализации
  tensorboard: true                          # Включить TensorBoard-логи (скаляры/изображения/гистограммы).
  wandb: false                               # Включить Weights & Biases (при наличии токена/клиента).
  tb_flush_secs: 10                          # Период сброса буфера TB на диск (секунды).
  log_images_every: 50                       # Периодичность логирования изображений (в шагах обучения).

model:                                       # Параметры архитектуры модели
                                             # Временные (placeholder) каналы согласно приложению к ТЗ — меняйте при изменении бэкбона
  c1: 96                                     # Кол-во каналов признаков на уровне F1 (ConvNeXt-Tiny выход). Типично: 64–128.
  c2: 192                                    # Кол-во каналов признаков на уровне F2 (CoAtNet-light выход). Типично: 128–256.
  c3: 384                                    # Кол-во каналов признаков на уровне F3 (GAT/Transformer выход). Типично: 256–512.
  film_dim: 256                              # Размер вектора FiLM-параметров для декодера. Типично: 128–512 (должен согласовываться с OMM.D).
  out_channels_ab: 2                         # Зарезервировано: кол-во выходных каналов a/b (текущей версией не переопределяется).
  out_channels_sat: 1                        # Зарезервировано: кол-во каналов насыщенности (sat) (текущей версией не переопределяется).
  use_saturation_head: true                  # Включить голову насыщенности (полезно для связанных регуляризаций/метрик). true|false.
                                             # Интеграция GuideNet (если потребуется внешний guidance)
  use_guidenet: false                        # Включить дополнительную сетку-подсказчик (в текущей версии — выключено). true|false.
  guide_feature_dim: null                    # Размерность признаков GuideNet (если включен), иначе null. Пример: 64, 128, 256.
  guide_out_dim: null                        # Размерность выхода GuideNet (если включен), иначе null. Пример: 16, 32, 64.

gan:                                         # Параметры PatchGAN дискриминатора (фаза 4)
  enabled: true                              # Включить GAN-тренировку на финальной фазе (см. curriculum). true|false; требует больше VRAM/времени.
  input_nc: 3                                # Число входных каналов в дискриминатор (RGB=3). Обычно 3; менять не требуется.
  ndf: 64                                    # Кол-во базовых каналов дискриминатора. Типично: 32–128 (больше — мощнее/тяжелее).
  n_layers: 3                                # Глубина дискриминатора (число слоёв). Типично: 2–5 (3 — сбалансированно).
  loss_type: hinge                           # Тип GAN-потери: hinge|bce. 'hinge' — устойчивее; 'bce' — классический but может быть менее стабильным.

validation:                                  # Параметры валидации
  enabled: true                              # Включить периодическую валидацию по валидационному набору. Частота см. training.validate_every_epochs.
  batch_size: 4                              # Размер батча на валидации (можно отличать от train). Подбирайте по памяти GPU.
  ssim_window: 11                            # Размер окна для SSIM (нечётный). Типично: 7, 11, 15.
  ssim_sigma: 1.5                            # Параметр гауссова окна SSIM. Типично: 1.0–2.0.
  lpips: true                                # Включить расчёт LPIPS (pip install lpips). Нагрузочно; типичная сеть: 'alex' (по умолчанию в пакете).
