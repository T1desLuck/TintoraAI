# Workflow для Python проекта: установка зависимостей, линтинг, тесты и загрузка coverage в Codecov
name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Скачиваем репозиторий
    - uses: actions/checkout@v4

    # Устанавливаем Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # Устанавливаем зависимости, включая pytest-cov для покрытия
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Линтинг кода
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --statistics

    # Запуск тестов и генерация coverage.xml
    - name: Test with pytest and coverage
      run: |
        pytest --cov=. --cov-report=xml

    # Загрузка coverage в Codecov
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        fail_ci_if_error: true