# Workflow для Python проекта: установка зависимостей, линтинг и запуск тестов
name: Python application

# Запуск workflow на пуш и PR в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Права для доступа к содержимому репозитория
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest  # Используем Ubuntu последней версии

    steps:
    # 1. Скачиваем репозиторий
    - uses: actions/checkout@v4

    # 2. Устанавливаем Python версии 3.10
    - name: Установка Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3. Устанавливаем зависимости
    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip          # Обновляем pip
        pip install flake8 pytest                    # Устанавливаем линтер и тесты
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Линтинг кода с помощью flake8
    - name: Линтинг кода
      run: |
        # Прерываем сборку на критических ошибках
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Остальные ошибки считаем предупреждениями
        flake8 . --count --exit-zero --max-complexity=10 --statistics

    # 5. Запуск тестов
    - name: Тесты
      run: |
        pytest